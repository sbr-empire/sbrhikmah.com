name: Deploy Firebase Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
      - run: npm install 2>/dev/null || true
      - run: npm run build 2>/dev/null || true
      - run: npm install -g firebase-tools
      - run: mkdir -p public && echo '<h1>SBR Hikmah</h1>' > public/index.html
      - run: firebase deploy --only hosting --project=sbrempire --token=${{ secrets.FIREBASE_TOKEN }}
